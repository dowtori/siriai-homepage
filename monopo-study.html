<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>monopo london — home study (light monochrome)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   monopo.london home — design training reproduction
   LIGHT MONOCHROME: whitish background, black type
   (개인 훈련용. 원본: https://monopo.london/)
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#f2f1ee;
  color:#111;
  font-family:"Inter Tight",Helvetica,Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  cursor:default;
}
:root{
  --pad-x:60px;
  --col1:27.2%;
  --col2:50.3%;
  --col3:73.4%;
  --ink:#111;
  --ink-soft:rgba(17,17,17,.55);
}

/* ---------- WebGL stage ---------- */
#stage{
  position:fixed;inset:0;width:100%;height:100%;display:block;
}

/* ---------- header ---------- */
.site-head{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:24px var(--pad-x) 0;
  pointer-events:none;
}
.site-head a{pointer-events:auto}

.logo{
  position:absolute;left:var(--pad-x);top:22px;
  display:flex;align-items:center;gap:12px;
  color:var(--ink);text-decoration:none;user-select:none;
}
.logo .m{font-weight:700;font-size:15px;letter-spacing:.02em}
.logo .bar{width:1px;height:16px;background:rgba(17,17,17,.45)}
.logo .c{font-weight:300;font-size:12px;letter-spacing:.04em;color:rgba(17,17,17,.85)}

.nav-col{
  position:absolute;top:24px;
  display:flex;flex-direction:column;gap:9px;
}
.nav-a{left:var(--col1)}
.nav-b{left:var(--col2)}
.nav-col a{
  position:relative;
  color:var(--ink);text-decoration:none;
  font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.92;
  transition:opacity .25s;
}
.nav-col a:hover{opacity:.5}
.nav-col a.on::before,
.nav-col a:hover::before{
  content:"";
  position:absolute;left:-13px;top:50%;
  width:0;height:0;margin-top:-3px;
  border-left:5px solid var(--ink);
  border-top:3px solid transparent;
  border-bottom:3px solid transparent;
}

.clocks{
  position:absolute;top:24px;left:var(--col3);
  display:flex;flex-direction:column;gap:9px;
}
.clock{
  position:relative;
  font-size:11px;font-weight:600;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.clock.on::before{
  content:"";
  position:absolute;left:-13px;top:50%;
  width:0;height:0;margin-top:-3px;
  border-left:5px solid var(--ink);
  border-top:3px solid transparent;
  border-bottom:3px solid transparent;
}

/* ---------- bottom captions ---------- */
.captions{position:fixed;left:0;right:0;bottom:26px;z-index:10;pointer-events:none}
.cap{position:absolute;bottom:0;line-height:1.32;font-size:15.5px}
.cap b{display:block;font-weight:600;color:var(--ink)}
.cap span{display:block;font-weight:400;color:var(--ink-soft)}
.cap.c1{left:var(--col1)}
.cap.c2{left:var(--col2)}
.cap.c3{left:var(--col3)}

/* scroll arrow */
.scroll-hint{
  position:fixed;right:78px;bottom:26px;z-index:10;
  width:12px;height:66px;overflow:hidden;pointer-events:none;
}
.scroll-hint svg{
  display:block;width:12px;height:66px;
  animation:hintLoop 2.4s cubic-bezier(.65,0,.35,1) infinite;
}
@keyframes hintLoop{
  0%{transform:translateY(-100%)}
  38%{transform:translateY(0)}
  62%{transform:translateY(0)}
  100%{transform:translateY(100%)}
}

/* rings badge (bottom-left) */
.rings{
  position:fixed;left:var(--pad-x);bottom:28px;z-index:10;
  opacity:.85;pointer-events:none;
}

/* ---------- intro loader ---------- */
.loader{
  position:fixed;inset:0;z-index:50;
  background:#f4f3f0;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .7s ease;
}
.loader.hide{opacity:0;pointer-events:none}
.loader .logo-lockup{display:flex;align-items:center;gap:14px;opacity:0;animation:loaderIn .8s ease forwards}
.loader .m{font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--ink)}
.loader .bar{width:1px;height:20px;background:rgba(17,17,17,.4)}
.loader .c{font-weight:300;font-size:14px;color:rgba(17,17,17,.85)}
@keyframes loaderIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
body.ready .rv{opacity:1;transform:none}
body.ready .rv.d1{transition-delay:.15s}
body.ready .rv.d2{transition-delay:.3s}
body.ready .rv.d3{transition-delay:.45s}

/* ---------- responsive ---------- */
@media (max-width:900px){
  :root{--pad-x:24px;--col1:44%;--col2:44%;--col3:auto}
  .nav-b{display:none}
  .clocks{left:auto;right:var(--pad-x)}
  .cap{position:static}
  .captions{display:flex;flex-direction:column;gap:14px;left:var(--pad-x);bottom:22px}
  .scroll-hint{right:24px}
}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<header class="site-head">
  <a class="logo rv" href="#">
    <span class="m">monopo</span><span class="bar"></span><span class="c">london</span>
  </a>
  <nav class="nav-col nav-a rv d1">
    <a href="#" class="on">Home</a>
    <a href="#">Work</a>
    <a href="#">Services</a>
  </nav>
  <nav class="nav-col nav-b rv d2">
    <a href="#">Team</a>
    <a href="#">Contact</a>
    <a href="#">Press &amp; News</a>
  </nav>
  <div class="clocks rv d3">
    <div class="clock on" id="ck-ldn">--:-- --</div>
    <div class="clock" id="ck-tyo">--:-- --</div>
    <div class="clock" id="ck-nyc">--:-- --</div>
  </div>
</header>

<div class="captions">
  <div class="cap c1 rv d1"><b>Based in London</b><span>Born in Tokyo</span></div>
  <div class="cap c2 rv d2"><b>Design-driven</b><span>creative agency</span></div>
  <div class="cap c3 rv d3"><b>Branding, digital</b><span>and communications</span></div>
</div>

<div class="scroll-hint rv d3">
  <svg viewBox="0 0 12 66" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 0 V58 M1 53 L6 59 L11 53" stroke="#111" stroke-width="1.1"/>
  </svg>
</div>

<div class="rings rv d2">
  <svg width="34" height="20" viewBox="0 0 34 20" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="9"  cy="10" r="7.5" stroke="#111" stroke-width=".9" opacity=".9"/>
    <circle cx="12" cy="10" r="7.5" stroke="#111" stroke-width=".7" opacity=".55"/>
    <circle cx="15" cy="10" r="7.5" stroke="#111" stroke-width=".6" opacity=".35"/>
    <circle cx="18" cy="10" r="7.5" stroke="#111" stroke-width=".5" opacity=".22"/>
  </svg>
</div>

<div class="loader" id="loader">
  <div class="logo-lockup">
    <span class="m">monopo</span><span class="bar"></span><span class="c">london</span>
  </div>
</div>

<script>
/* ============================================================
   Live clocks — London / Tokyo / New York
   ============================================================ */
(function clocks(){
  const defs = [
    ['ck-ldn','Europe/London'],
    ['ck-tyo','Asia/Tokyo'],
    ['ck-nyc','America/New_York'],
  ];
  const fmts = defs.map(([id,tz]) => [
    document.getElementById(id),
    new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:tz})
  ]);
  function tick(){
    const now = new Date();
    for(const [el,f] of fmts) el.textContent = f.format(now);
  }
  tick();
  setInterval(tick, 1000);
})();

/* ============================================================
   WebGL stage — LIGHT MONOCHROME
   - whitish fluid-gradient background (domain-warped fbm)
     with graphite/ink blobs and near-black pools inverted to
     bright paper pools
   - film grain
   - black headline drawn to an offscreen 2D canvas -> texture
   - Japanese twin layer revealed inside a glass-lens sphere
     that eases after the pointer (ghost-fringed glyphs, dark rim)
   ============================================================ */
(function stage(){
  const canvas = document.getElementById('stage');
  const gl = canvas.getContext('webgl', {antialias:false, alpha:false});
  if(!gl){ canvas.style.background = '#eee'; return; }

  /* ---------- shaders ---------- */
  const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

  const FRAG = `
precision highp float;
varying vec2 vUv;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uLens;      // cursor slab centre, px (y up)
uniform float uLensR;     // slab half-size basis, px
uniform float uReveal;    // 0..1 intro reveal
uniform vec2  uDrift;     // pointer parallax
uniform float uTile;      // background tile size, px
uniform mat2  uStretchInv;// inverse of velocity fluid-stretch
uniform vec2  uMouse;     // eased pointer, uv space (y up) — bg orb
uniform sampler2D uTextEn;
uniform sampler2D uTextJp;

/* --- noise --- */
float hash(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.55;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for(int i = 0; i < 3; i++){
    v += a * noise(p);
    p = rot * p * 1.9;
    a *= 0.45;
  }
  return v;
}

/* --- light monochrome fluid gradient ---
   original: black field + orange & blue blobs w/ white blend cores
   light map: paper field + grey & graphite blobs + ink cores,
   with bright paper pools carved back out */
vec3 background(vec2 uv){
  float aspect = uRes.x / uRes.y;
  vec2 p = (uv - 0.5) * vec2(aspect, 1.0) * 0.72;
  p += uDrift * 0.14;                              // field leans after the pointer
  float t = uTime * 0.05;

  vec2 q = vec2(
    fbm(p * 1.1 + t * 0.8),
    fbm(p * 1.1 + vec2(3.7, 8.2) - t * 0.5)
  );
  float f = fbm(p * 1.15 + 2.6 * q + t * 0.25);   // main tone field
  float m = fbm(p * 0.85 - 2.0 * q + vec2(6.1, 0.4) - t * 0.3); // pool field

  /* barely-there ramp: paper -> whisper grey (nothing dark, ever) */
  vec3 col = mix(vec3(0.978), vec3(0.905), smoothstep(0.27, 0.46, f));
  col = mix(col, vec3(0.85), smoothstep(0.48, 0.63, f));
  col = mix(col, vec3(0.805), smoothstep(0.66, 0.80, f));

  /* carve bright paper pools from a second field */
  col = mix(col, vec3(0.995), smoothstep(0.56, 0.82, m));

  /* coloured orb trailing the pointer, glowing under the tiles */
  float dm = length((uv - uMouse) * vec2(aspect, 1.0));
  col = mix(col, vec3(0.46, 0.80, 0.22), exp(-pow(dm / 0.17, 2.0)) * 0.85);
  col = mix(col, vec3(0.93, 0.95, 0.28), exp(-pow(dm / 0.075, 2.0)) * 0.92);
  return col;
}

/* rounded-rect SDF (px) */
float rrect(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float enA(vec2 uv){
  if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 0.0;
  return texture2D(uTextEn, uv).a;
}
float jpA(vec2 uv){
  if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 0.0;
  return texture2D(uTextJp, uv).a;
}

void main(){
  vec2 fc = vUv * uRes;

  /* ===== glassmorphism pixel-tile background =====
     the fluid gradient is quantised per tile, each tile shaded
     like a frosted glass square (top-lit, inner rim, grout gap) */
  float TS = uTile;
  vec2 cell = floor(fc / TS);
  vec2 cpx = (fract(fc / TS) - 0.5) * TS;        // px within cell, y up
  vec2 ccUv = (cell + 0.5) * TS / uRes;          // cell centre uv
  float dt = rrect(cpx, vec2(TS * 0.5 - TS * 0.045), TS * 0.20);

  vec3 fluidCell = background(ccUv);
  vec3 fluidPix  = background(vUv);
  vec3 tcol = mix(fluidCell, fluidPix, 0.30);    // hint of gradient inside tile
  tcol = mix(tcol, vec3(1.0), 0.14);             // frosted white lift

  /* tile visibility follows tone: on pure white the grid vanishes
     completely — tiles only surface where the fluid/orb tints them */
  float str = clamp(length(vec3(1.0) - tcol) * 2.4, 0.0, 1.0);

  tcol += vec3(0.07 * str) * smoothstep(-TS * 0.5, TS * 0.5, cpx.y);   // top-lit
  float rimT = smoothstep(-3.0, -0.6, dt);
  tcol += vec3(0.10 * str) * rimT * (0.35 + 0.65 * smoothstep(-TS * 0.2, TS * 0.35, cpx.y));
  tcol -= vec3(0.05 * str) * rimT * smoothstep(TS * 0.1, -TS * 0.35, cpx.y);

  vec3 grout = vec3(0.978);
  grout *= 1.0 - 0.12 * str * smoothstep(3.5, 0.0, dt); // shadow only where tinted
  float tileMask = 1.0 - smoothstep(-0.8, 0.8, dt);
  vec3 col = mix(grout, tcol, tileMask);

  /* headline reveal: rise + fade */
  vec2 tuv = vec2(vUv.x, 1.0 - vUv.y);
  tuv.y += (1.0 - uReveal) * 0.035;
  float textAlpha = uReveal;

  /* ----- black english headline over the tiles ----- */
  float en = enA(tuv);
  vec3 outsideCol = mix(col, vec3(0.05), en * textAlpha);

  /* ===== invisible cursor zone — function only, no chrome =====
     inside a feathered region trailing the pointer the english
     headline crossfades into its japanese twin (grey ghost echoes).
     the zone still fluid-stretches with velocity, but draws nothing. */
  vec2 lp = uStretchInv * (fc - uLens);
  float H = uLensR * 1.12;                        // zone half-size
  float dBig = rrect(lp, vec2(H), H * 0.16);

  vec3 finalCol = outsideCol;
  if(dBig < 2.0){
    /* soft feather: 1 deep inside -> 0 at the edge */
    float fm = 1.0 - smoothstep(-H * 0.45, 0.0, dBig);

    /* japanese layer w/ mono ghost echoes, sampled in place */
    float dl = length(lp);
    vec2 dir = (dl > 0.5) ? lp / dl : vec2(0.0);
    vec2 g1 = dir * 3.0 / uRes;
    float j0 = jpA(tuv);
    float j1 = jpA(tuv + g1);
    float j2 = jpA(tuv - g1 * 0.6);
    vec3 swapped = mix(col, vec3(0.05), j0 * textAlpha);
    swapped = mix(swapped, vec3(0.42), j1 * (1.0 - j0) * 0.8 * textAlpha);
    swapped = mix(swapped, vec3(0.62), j2 * (1.0 - j0) * 0.6 * textAlpha);

    finalCol = mix(outsideCol, swapped, fm);
  }
  col = finalCol;

  /* film grain — feather-light on paper */
  float g = hash(fc + fract(uTime) * 100.0);
  col += (g - 0.5) * 0.03;

  /* intro: resolve from plain paper white */
  col = mix(vec3(0.98), col, 0.25 + 0.75 * smoothstep(0.0, 0.6, uReveal));

  gl_FragColor = vec4(col, 1.0);
}`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const locPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(locPos);
  gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  for(const n of ['uRes','uTime','uLens','uLensR','uReveal','uDrift','uTile','uStretchInv','uMouse','uTextEn','uTextJp'])
    U[n] = gl.getUniformLocation(prog, n);

  /* ---------- text textures ---------- */
  const texEn = gl.createTexture();
  const texJp = gl.createTexture();
  function setupTex(tex, unit){
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  }
  setupTex(texEn, 0);
  setupTex(texJp, 1);
  gl.uniform1i(U.uTextEn, 0);
  gl.uniform1i(U.uTextJp, 1);

  /* headline layout — staggered 3 lines like the original */
  const EN_LINES = [
    {t:'We are a brand', x:0.255, y:0.405},
    {t:'of collective',  x:0.420, y:0.545},
    {t:'creativity',     x:0.360, y:0.685},
  ];
  const JP_LINES = [
    {t:'私たちは集合的な', x:0.255, y:0.405},
    {t:'創造性を持つ',     x:0.420, y:0.545},
    {t:'ブランドです',     x:0.360, y:0.685},
  ];

  const txtCanvas = document.createElement('canvas');
  const txtCtx = txtCanvas.getContext('2d');

  function paintText(lines, fontFamily, sizeMul){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    txtCanvas.width = Math.round(w * dpr);
    txtCanvas.height = Math.round(h * dpr);
    txtCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    txtCtx.clearRect(0, 0, w, h);
    const size = Math.min(w * 0.067, h * 0.15) * sizeMul;
    txtCtx.font = `450 ${size}px ${fontFamily}`;
    txtCtx.fillStyle = '#fff';   /* texture stores alpha only; tint in shader */
    txtCtx.textBaseline = 'middle';
    if('letterSpacing' in txtCtx) txtCtx.letterSpacing = (-size * 0.018) + 'px';
    for(const l of lines) txtCtx.fillText(l.t, l.x * w, l.y * h);
  }

  function uploadText(tex, unit, lines, fontFamily, sizeMul){
    paintText(lines, fontFamily, sizeMul);
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, txtCanvas);
  }

  function refreshTextures(){
    uploadText(texEn, 0, EN_LINES, '"Inter Tight",Helvetica,Arial,sans-serif', 1.0);
    uploadText(texJp, 1, JP_LINES, '"Noto Sans JP","Inter Tight",sans-serif', 0.82);
  }

  /* ---------- sizing ---------- */
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    refreshTextures();
  }
  window.addEventListener('resize', resize);

  /* ---------- pointer / lens ---------- */
  const lens = {x:0.5, y:0.49, tx:0.5, ty:0.49};   // fractions, y from top
  const orb  = {x:0.5, y:0.49};                    // slower tracker for the bg orb
  const drift = {x:0, y:0, tx:0, ty:0};
  let pointerActive = false;
  window.addEventListener('pointermove', e => {
    pointerActive = true;
    lens.tx = e.clientX / window.innerWidth;
    lens.ty = e.clientY / window.innerHeight;
    drift.tx = (lens.tx - 0.5) * 2.0;
    drift.ty = (lens.ty - 0.5) * 2.0;
  });
  window.addEventListener('pointerleave', () => {
    pointerActive = false;
    lens.tx = 0.5; lens.ty = 0.49;
    drift.tx = 0; drift.ty = 0;
  });

  /* ---------- loop ---------- */
  let reveal = 0, revealAt = 0, start = performance.now();
  let prevGx = 0, prevGy = 0, eSm = 0, aSm = 0;   // velocity fluid-stretch state
  window.__mono = { get reveal(){ return reveal; }, lens };
  function frame(now){
    const t = (now - start) / 1000;

    /* idle float when the pointer is away */
    let ax = lens.tx, ay = lens.ty;
    if(!pointerActive){
      ax += Math.sin(t * 0.5) * 0.012;
      ay += Math.cos(t * 0.38) * 0.014;
    }
    lens.x += (ax - lens.x) * 0.055;
    lens.y += (ay - lens.y) * 0.055;
    orb.x  += (ax - orb.x) * 0.035;               // orb lags a touch behind
    orb.y  += (ay - orb.y) * 0.035;
    drift.x += (drift.tx - drift.x) * 0.03;
    drift.y += (drift.ty - drift.y) * 0.03;

    if(revealAt) reveal = Math.min(1, (now - revealAt) / 1100);

    const dpr = canvas.width / Math.max(canvas.clientWidth, 1);
    const gx = lens.x * canvas.width, gy = (1.0 - lens.y) * canvas.height;

    /* velocity fluid-stretch (glass-cursor.js recipe, GL space y-up) */
    const dxp = gx - prevGx, dyp = gy - prevGy;
    prevGx = gx; prevGy = gy;
    const speed = Math.hypot(dxp, dyp);
    const eTgt = Math.min(speed * 0.0022 / dpr, 0.16);
    eSm += (eTgt - eSm) * 0.18;
    if(speed > 0.5) aSm = Math.atan2(dyp, dxp);
    const c = Math.cos(aSm), s = Math.sin(aSm);
    const isx = 1 / (1 + eSm), isy = 1 / (1 - eSm * 0.55);
    /* inverse of R(a)·S(1+e, 1-.55e)·R(-a) */
    const m00 = c * c * isx + s * s * isy;
    const m11 = s * s * isx + c * c * isy;
    const m01 = c * s * (isx - isy);
    gl.uniformMatrix2fv(U.uStretchInv, false, [m00, m01, m01, m11]);

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform2f(U.uLens, gx, gy);
    gl.uniform1f(U.uLensR, canvas.clientWidth * 0.053 * dpr);
    gl.uniform1f(U.uTile, Math.max(64, Math.min(canvas.clientWidth / 14, 118)) * dpr);
    gl.uniform1f(U.uReveal, reveal);
    gl.uniform2f(U.uDrift, drift.x, drift.y);
    gl.uniform2f(U.uMouse, orb.x, 1.0 - orb.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  /* ---------- boot: wait for fonts, then reveal ---------- */
  resize();
  requestAnimationFrame(frame);

  const ready = Promise.all([
    document.fonts.ready,
    new Promise(res => setTimeout(res, 900)),   // let the loader breathe
  ]);
  ready.then(() => {
    refreshTextures();                          // repaint with real fonts
    document.getElementById('loader').classList.add('hide');
    document.body.classList.add('ready');
    revealAt = performance.now();
  });
})();
</script>
</body>
</html>
